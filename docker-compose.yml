services:
  calculator:
    # Jenkins overrides IMAGE_TAG with the build number; defaults to a local build.
    image: ${IMAGE_NAME:-calculator}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculator-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 5000
      SPRING_APPLICATION_NAME: calculator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    expose:
      - "5000"
    networks:
      - calculator-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: calculator-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calculator-net
    # Only start proxying once the API reports healthy
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  calculator-net:
    driver: bridge
