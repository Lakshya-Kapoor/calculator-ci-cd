upstream calculator_api {
    # "calculator" resolves via the Compose network's internal DNS
    server calculator:5000;
}

server {
    listen 80;
    server_name _;

    # Proxy's own liveness endpoint, served without touching the API
    location = /health {
        access_log off;
        return 200 "proxy ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://calculator_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
